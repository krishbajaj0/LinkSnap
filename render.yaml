services:
  - type: web
    name: linksnap
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: npm ci --prefix client --include=dev --registry=https://registry.npmjs.org --replace-registry-host=always && npm ci --prefix server --omit=dev --registry=https://registry.npmjs.org --replace-registry-host=always && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: '>=22.13.0 <23.0.0'
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_URI
        sync: false
      - key: AUTH_SECRET
        sync: false
